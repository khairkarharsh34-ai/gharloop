# Netlify settings for the gharloop.com marketing website (a separate Netlify site with base directory "website").
[build]
  publish = "."
  command = "echo 'static site, nothing to build'"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/app"
  to = "https://app.gharloop.com"
  status = 302
